<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Forgot Password · PixelBlend</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="css/pb-auth-screens.css?v=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body class="pb-forgot-body">
  <div class="pb-forgot-card">
    <a class="pb-forgot-back-abs" id="back-x" href="login.html" aria-label="Back">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M15 18l-6-6 6-6" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </a>

    <div class="pb-forgot-brand">
      <div class="pb-auth-badge" aria-hidden="true">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none">
          <path d="M12 3l1.5 4.3L18 9l-4.5 1.7L12 15l-1.5-4.3L6 9l4.5-1.7z" fill="#fff"/>
          <path d="M18.5 14l.8 2.2L21.5 17l-2.2.8L18.5 20l-.8-2.2L15.5 17l2.2-.8z" fill="#fff" opacity=".9"/>
          <path d="M6.2 15.5l.55 1.5 1.55.55-1.55.55-.55 1.5-.55-1.5-1.55-.55 1.55-.55z" fill="#fff" opacity=".85"/>
        </svg>
      </div>
      <strong>PixelBlend</strong>
      <span>Reset your password</span>
    </div>

    <div class="pb-forgot-copy">
      <h1>Forgot Password?</h1>
      <p>No worries, we'll send you reset instructions</p>
    </div>

    <form id="forgot-form" novalidate>
      <div class="pb-auth-field" id="f-phone">
        <label for="phone">Phone number</label>
        <div class="pb-auth-input">
          <span class="pb-auth-ico" aria-hidden="true">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M7.5 3.5h3l1.2 4.2-1.8 1.1a13 13 0 005.3 5.3l1.1-1.8 4.2 1.2v3a2 2 0 01-2.2 2A15.5 15.5 0 015.5 5.7a2 2 0 012-2.2z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></svg>
          </span>
          <input id="phone" name="phone" type="tel" inputmode="numeric" autocomplete="tel" placeholder="Enter your phone number">
        </div>
        <div class="pb-auth-err">Phone number is required</div>
      </div>

      <button class="pb-auth-submit" type="submit" id="send-otp" style="margin-top:6px;">Send OTP</button>
      <div class="pb-forgot-ok" id="otp-ok">OTP sent! Check your phone for reset instructions. (Demo)</div>
    </form>

    <div class="pb-forgot-foot">
      <a id="back-login" href="login.html">← Back to login</a>
    </div>
  </div>

  <p class="pb-forgot-legal">
    By continuing, you agree to our <a href="terms-of-service.html">Terms</a> and <a href="privacy-policy.html">Privacy Policy</a>
  </p>

<script src="js/pb-auth.js?v=1"></script>
<script src="js/pb-auth-screens.js?v=1"></script>
<script>
(function () {
  var loginHref = pbAuthScreens.withNext('login.html');
  document.getElementById('back-x').href = loginHref;
  document.getElementById('back-login').href = loginHref;

  document.getElementById('phone').addEventListener('input', function () {
    pbAuthScreens.setError(document.getElementById('f-phone'), false);
  });

  document.getElementById('forgot-form').addEventListener('submit', function (e) {
    e.preventDefault();
    var phone = document.getElementById('phone').value.trim();
    var ok = pbAuthScreens.validPhone(phone);
    pbAuthScreens.setError(document.getElementById('f-phone'), !ok);
    if (!ok) return;
    var okEl = document.getElementById('otp-ok');
    okEl.classList.add('is-show');
    document.getElementById('send-otp').disabled = true;
    document.getElementById('send-otp').textContent = 'OTP Sent';
  });
})();
</script>
</body>
</html>
