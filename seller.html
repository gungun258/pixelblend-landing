<style>
  :root {
    --ink: #1E1422; --muted: #5b5060; --soft: #8A7E92; --line: #F0E6F2;
    --bg: #FBFAFC; --accent: #C42E8B;
    --grad: linear-gradient(113.667deg, #A855F7, #EC4899, #F43F5E);
  }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: 'Hanken Grotesk', sans-serif; background: var(--bg); color: var(--ink); -webkit-font-smoothing: antialiased; }
  img { max-width: 100%; display: block; }
  a { color: inherit; text-decoration: none; }
  button { font-family: inherit; cursor: pointer; }
  [hidden] { display: none !important; }

  .pb-shell { display: flex; min-height: 100vh; background: var(--bg); }
  .pb-sidebar {
    width: 202px; flex: 0 0 202px; position: sticky; top: 0; height: 100vh;
    padding: 28px 14px 16px; display: flex; flex-direction: column;
    background: #fff; border-right: 1px solid var(--line);
  }
  .pb-brand { display: flex; align-items: center; gap: 10px; padding: 2px 4px; margin-bottom: 18px; }
  .pb-logo-mark {
    width: 32px; height: 32px; border-radius: 11px; background: var(--grad);
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 6px 16px rgba(196,46,139,.32); flex-shrink: 0;
  }
  .pb-logo-mark span { width: 12px; height: 12px; border: 2.5px solid #fff; border-radius: 50%; box-sizing: border-box; }
  .pb-brand-text {
    font-size: 17px; font-weight: 600; letter-spacing: -.02em;
    background: linear-gradient(90deg, #9333EA, #DB2777);
    -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent;
  }
  .pb-newblend {
    display: flex; align-items: center; justify-content: center; gap: 7px;
    padding: 11px 10px; border-radius: 12px; margin-bottom: 18px;
    background: var(--grad); color: #fff; font-size: 12px; font-weight: 700;
  }
  .pb-nav { display: flex; flex-direction: column; gap: 3.2px; }
  .pb-nav a {
    display: flex; align-items: center; gap: 10px; padding: 10px 11px; border-radius: 11px;
    font-size: 12px; font-weight: 600; color: var(--muted); min-height: 42px;
  }
  .pb-nav a:hover { background: #FBF1FB; color: var(--accent); }
  .pb-nav a.active { background: #FBEEF6; color: var(--accent); font-weight: 800; }
  .pb-nav a .pb-ico { width: 22px; height: 22px; display: flex; align-items: center; justify-content: center; }
  .pb-navbadge {
    margin-left: auto; font-size: 9px; font-weight: 800; color: var(--accent);
    background: #FCE7F0; padding: 2px 6px; border-radius: 999px; min-width: 18px; text-align: center;
  }
  .pb-navbadge[hidden] { display: none !important; }
  .pb-credits {
    margin-top: auto; border: 1px solid var(--line); border-radius: 16px; padding: 14px;
    background: linear-gradient(165deg, #FBF1FB 0%, #fff 70%);
  }
  .pb-main { flex: 1 1 0; min-width: 0; display: flex; flex-direction: column; min-height: 100vh; }
  .pb-topbar {
    position: sticky; top: 0; z-index: 20; display: flex; align-items: center; gap: 16px;
    min-height: 64px; padding: 14px 32px;
    background: rgba(250,244,251,.88); backdrop-filter: blur(10px);
    border-bottom: 1px solid var(--line); flex-shrink: 0; box-sizing: border-box;
  }
  .pb-topbar-title { font-size: 15px; font-weight: 800; letter-spacing: -.02em; line-height: 1.2; }
  .pb-topbar-sub { font-size: 11px; color: #8A7E92; margin-top: 2px; line-height: 1.3; }
  .pb-top-actions { margin-left: auto; display: flex; align-items: center; gap: 12px; flex-shrink: 0; }
  .pb-content {
    flex: 1 1 auto; padding: 0 0 40px; width: 100%; min-height: 0;
    display: flex; flex-direction: column; align-items: stretch;
  }
  .pb-toggle { display: none; }

  .sp-cover {
    position: relative;
    width: 100%;
    height: 220px;
    overflow: hidden;
    background: #FBFAFC;
    border-bottom: none;
  }
  .sp-cover img {
    width: 100%; height: 100%; object-fit: cover; display: block;
  }
  .sp-cover::after {
    content: '';
    position: absolute; left: 0; right: 0; bottom: 0; height: 72%;
    background: linear-gradient(
      180deg,
      rgba(251,250,252,0) 0%,
      rgba(251,250,252,.28) 35%,
      rgba(251,250,252,.72) 68%,
      #FBFAFC 100%
    );
    pointer-events: none;
  }
  .sp-flow {
    width: min(980px, 100%);
    margin: -56px auto 0;
    padding: 0 32px;
    position: relative;
    z-index: 1;
  }
  .sp-profile {
    display: flex; align-items: center; gap: 16px;
    margin-bottom: 16px;
  }
  .sp-avatar-wrap {
    flex-shrink: 0;
    width: 104px; height: 104px; border-radius: 50%;
    padding: 4px;
    background: linear-gradient(135deg, #A855F7 0%, #EC4899 45%, #F43F5E 100%);
    box-shadow: 0 8px 20px rgba(168, 85, 247, .28);
  }
  .sp-avatar {
    width: 100%; height: 100%; border-radius: 50%; object-fit: cover; display: block;
    border: 3px solid #fff;
    background: #fff;
  }
  .sp-identity { min-width: 0; padding-top: 0; display: flex; flex-direction: column; justify-content: center; }
  .sp-name { margin: 0 0 4px; font-size: 24px; font-weight: 800; letter-spacing: -.03em; }
  .sp-tag { margin: 0; font-size: 14px; font-weight: 600; color: #64748B; }
  .sp-bio {
    margin: 0 0 18px; max-width: 520px;
    font-size: 13px; line-height: 1.45; color: var(--soft); font-weight: 500;
  }

  .sp-stats {
    display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px;
    background: #fff; border: 1px solid var(--line); border-radius: 16px;
    padding: 14px 10px; margin-bottom: 14px;
    box-shadow: 0 8px 22px -18px rgba(30,20,34,.3);
  }
  .sp-stat { text-align: center; }
  .sp-stat strong { display: block; font-size: 18px; font-weight: 800; letter-spacing: -.02em; }
  .sp-stat span { font-size: 12px; font-weight: 600; color: var(--soft); }

  .sp-actions {
    display: flex; align-items: center; justify-content: center; gap: 10px;
    margin: 0 auto 28px; max-width: 360px;
  }
  .sp-btn {
    flex: 1 1 0; max-width: 160px;
    display: inline-flex; align-items: center; justify-content: center; gap: 6px;
    padding: 10px 14px; border-radius: 999px; border: none; font-size: 13px; font-weight: 800;
  }
  .sp-btn-follow {
    color: #fff; background: var(--grad);
    box-shadow: 0 10px 22px rgba(168,85,247,.32);
  }
  .sp-btn-follow:hover { transform: translateY(-1px); }
  .sp-btn-follow.is-on { background: #F1F5F9; color: #64748B; box-shadow: none; }
  .sp-btn-contact { color: #1E1422; background: #F1F5F9; }
  .sp-btn-contact:hover { background: #E2E8F0; }

  .sp-listings-h {
    margin: 0 0 14px; font-size: 18px; font-weight: 800; letter-spacing: -.02em;
  }
  .sp-grid {
    display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px;
  }
  .sp-card {
    display: block; background: #fff; border: 1px solid var(--line);
    border-radius: 14px; overflow: hidden; text-decoration: none; color: inherit;
    box-shadow: 0 10px 24px -20px rgba(30,20,34,.35);
  }
  .sp-card:hover { transform: translateY(-2px); box-shadow: 0 14px 28px -18px rgba(168,85,247,.4); }
  .sp-card-media {
    position: relative; aspect-ratio: 1; background: #F1F5F9; overflow: hidden;
  }
  .sp-card-media img { width: 100%; height: 100%; object-fit: cover; }
  .sp-heart {
    position: absolute; top: 10px; right: 10px; width: 30px; height: 30px; border-radius: 50%;
    border: none; background: rgba(255,255,255,.96);
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 4px 12px rgba(30,20,34,.12); cursor: pointer;
  }
  .sp-trend {
    position: absolute; top: 10px; left: 10px; width: 30px; height: 30px; border-radius: 50%;
    background: var(--grad); display: flex; align-items: center; justify-content: center;
    box-shadow: 0 6px 14px rgba(168,85,247,.35);
  }
  .sp-card-body { padding: 8px 10px 10px; }
  .sp-card-title {
    margin: 0 0 6px; font-size: 13px; font-weight: 800; letter-spacing: -.01em;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .sp-card-meta {
    display: flex; align-items: center; justify-content: space-between; gap: 6px;
    font-size: 11px; font-weight: 700;
  }
  .sp-price { display: inline-flex; align-items: center; gap: 5px; color: #7C3AED; }
  .sp-likes { display: inline-flex; align-items: center; gap: 4px; color: #EC4899; }

  @media (max-width: 1079px) {
    .pb-sidebar { position: fixed; left: 0; top: 0; z-index: 50; width: 61px; flex-basis: 61px; padding: 22px 10px 14px; align-items: center; }
    .pb-sidebar.open { width: 202px; flex-basis: 202px; padding: 28px 14px 16px; align-items: stretch; box-shadow: 14px 0 38px -22px rgba(30,20,34,.4); }
    .pb-main { margin-left: 61px; }
    .pb-brand-text, .pb-label, .pb-navlabel, .pb-credits { display: none; }
    .pb-sidebar.open .pb-brand-text, .pb-sidebar.open .pb-label, .pb-sidebar.open .pb-navlabel, .pb-sidebar.open .pb-credits { display: block; }
    .pb-toggle { display: flex; width: 35px; height: 35px; border-radius: 10px; border: 1px solid var(--line); background: #fff; align-items: center; justify-content: center; margin-bottom: 14px; }
  }
  @media (max-width: 900px) {
    .sp-grid { grid-template-columns: repeat(3, minmax(0, 1fr)); }
    .sp-flow { padding: 0 20px; }
  }
  @media (max-width: 767px) {
    .pb-topbar { padding: 12px 16px; min-height: 56px; }
    .sp-cover { height: 160px; }
    .sp-flow { margin-top: -48px; padding: 0 16px; }
    .sp-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
    .sp-name { font-size: 20px; }
    .sp-avatar-wrap { width: 88px; height: 88px; }
    .sp-identity { padding-top: 0; }
  }
</style>
</head>

  function qs(name) {
    try { return new URLSearchParams(window.location.search).get(name); }
    catch (e) { return null; }
  }

  function render(seller) {
    document.title = seller.name + ' · PixelBlend Studio';
    document.getElementById('sp-top-title').textContent = seller.name;
    document.getElementById('sp-avatar').src = seller.avatar;
    document.getElementById('sp-avatar').alt = seller.name;
    var banner = document.getElementById('sp-banner');
    if (banner) {
      banner.src = seller.banner || 'https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?w=1600&q=85&auto=format&fit=crop';
      banner.alt = seller.name + ' banner';
    }
    document.getElementById('sp-name').textContent = seller.name;
    document.getElementById('sp-tag').textContent = seller.tag;
    document.getElementById('sp-bio').textContent = seller.bio;
    document.getElementById('sp-listings-n').textContent = String(seller.items.length);
    document.getElementById('sp-followers').textContent = seller.followers;
    document.getElementById('sp-gens').textContent = seller.gens;
    document.getElementById('sp-listings-h').textContent = 'Listings (' + seller.items.length + ')';

    var grid = document.getElementById('sp-grid');
    grid.innerHTML = '';
    seller.items.forEach(function (item) {
      var a = document.createElement('a');
      a.className = 'sp-card';
      a.href = 'listing.html?id=' + encodeURIComponent(item.id);
      a.innerHTML =
        '<div class="sp-card-media">' +
          '<img src="' + item.img + '" alt="' + item.title + '">' +
          (item.trending
            ? '<span class="sp-trend" title="Trending"><svg width="14" height="14" viewBox="0 0 24 24" fill="none"><path d="M3.5 16.5l5.2-5.2 3.3 3.3 6.5-7.1" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M14.2 7.5h4.3v4.3" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg></span>'
            : '') +
          '<button type="button" class="sp-heart" aria-label="Like" aria-pressed="false" data-stop="1"><svg width="14" height="14" viewBox="0 0 24 24" fill="none"><path class="sp-heart-path" d="M12 20s-7-4.4-7-9.2A3.8 3.8 0 0112 8.2a3.8 3.8 0 017 2.6C19 15.6 12 20 12 20z" stroke="#EC4899" stroke-width="1.9" stroke-linejoin="round"/></svg></button>' +
        '</div>' +
        '<div class="sp-card-body">' +
          '<h3 class="sp-card-title">' + item.title + '</h3>' +
          '<div class="sp-card-meta">' +
            '<span class="sp-price"><svg width="12" height="12" viewBox="0 0 24 24" fill="#A855F7"><path d="M12 2l2.4 7.2L22 12l-7.6 2.8L12 22l-2.4-7.2L2 12l7.6-2.8z"/></svg>' + item.price + '</span>' +
            '<span class="sp-likes"><svg width="12" height="12" viewBox="0 0 24 24" fill="#EC4899"><path d="M12 20s-7-4.4-7-9.2A3.8 3.8 0 0112 8.2a3.8 3.8 0 017 2.6C19 15.6 12 20 12 20z"/></svg>' + item.likes + '</span>' +
          '</div>' +
        '</div>';
      grid.appendChild(a);
    });

    grid.querySelectorAll('[data-stop]').forEach(function (btn) {
      btn.addEventListener('click', function (e) {
        e.preventDefault();
        e.stopPropagation();
        var on = btn.classList.toggle('is-liked');
        btn.setAttribute('aria-pressed', on ? 'true' : 'false');
        var path = btn.querySelector('.sp-heart-path');
        if (path) {
          if (on) {
            path.setAttribute('fill', '#EC4899');
            path.setAttribute('stroke', '#EC4899');
          } else {
            path.setAttribute('fill', 'none');
            path.setAttribute('stroke', '#EC4899');
          }
        }
      });
    });
  }

  var id = qs('id') || 'visual-vibes';
  var seller = SELLERS[id] || SELLERS['visual-vibes'];
  render(seller);

  var followBtn = document.getElementById('sp-follow');
  followBtn.addEventListener('click', function () {
    var on = followBtn.classList.toggle('is-on');
    followBtn.innerHTML = on
      ? 'Following'
      : '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" aria-hidden="true"><circle cx="10" cy="8" r="3.2" stroke="currentColor" stroke-width="1.9"/><path d="M4.5 19c.9-3.2 3.2-4.8 5.5-4.8s4.6 1.6 5.5 4.8M17 8v6M14 11h6" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"/></svg> Follow';
  });
  document.getElementById('sp-contact').addEventListener('click', function () {
    alert('Contact seller — coming soon in Studio.');
  });

  var toggle = document.getElementById('pb-toggle');
  var sidebar = document.getElementById('pb-sidebar');
  if (toggle && sidebar) {
    toggle.addEventListener('click', function () {
      sidebar.classList.toggle('open');
    });
  }
})();
</script>
