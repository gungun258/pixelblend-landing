<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Creating · PixelBlend</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh;
    font-family: 'Hanken Grotesk', sans-serif;
    display: flex; align-items: center; justify-content: center;
    background: linear-gradient(135deg, #9333EA, #DB2777, #E11D48);
    color: #fff; -webkit-font-smoothing: antialiased;
    overflow: hidden;
  }
  .gl-wrap {
    width: min(400px, 100%);
    padding: 32px 32px 40px;
    display: flex; flex-direction: column; align-items: center; text-align: center;
  }
  .gl-icon {
    width: 128px; height: 128px; border-radius: 50%;
    background: rgba(255,255,255,.2);
    display: flex; align-items: center; justify-content: center;
    margin-bottom: 32px;
    animation: glPulse 2s ease-in-out infinite, glSpin 3s linear infinite;
  }
  @keyframes glSpin {
    from { transform: rotate(0deg) scale(1); }
    to { transform: rotate(360deg) scale(1); }
  }
  @keyframes glPulse {
    0%, 100% { box-shadow: 0 0 0 0 rgba(255,255,255,.15); }
    50% { box-shadow: 0 0 0 16px rgba(255,255,255,0); }
  }
  .gl-step {
    min-height: 56px; margin-bottom: 32px;
    display: flex; align-items: center; justify-content: center; gap: 12px;
    width: 100%;
  }
  .gl-step svg { flex-shrink: 0; }
  .gl-step span {
    font-size: 22px; font-weight: 700; line-height: 1.25; text-align: center;
  }
  .gl-progress { width: 100%; margin-bottom: 24px; }
  .gl-track {
    width: 100%; height: 12px; border-radius: 999px;
    background: rgba(255,255,255,.2); overflow: hidden;
  }
  .gl-fill {
    height: 100%; width: 1%; min-width: 4px; border-radius: 999px;
    background: linear-gradient(90deg, #fff, #FEF08A);
    transition: width .08s linear;
  }
  .gl-pct {
    margin-top: 8px; font-size: 14px; font-weight: 500;
    color: rgba(255,255,255,.9);
  }
  .gl-dots { display: flex; gap: 8px; align-items: center; justify-content: center; }
  .gl-dot {
    width: 8px; height: 8px; border-radius: 4px;
    background: rgba(255,255,255,.4); transition: .25s ease;
  }
  .gl-dot.on { width: 24px; background: #fff; }
  .gl-foot {
    margin-top: 32px; font-size: 14px; color: rgba(255,255,255,.8);
    animation: glBlink 2s ease-in-out infinite;
  }
  @keyframes glBlink {
    0%, 100% { opacity: .7; }
    50% { opacity: 1; }
  }
</style>
</head>
<body>
  <div class="gl-wrap">
    <div class="gl-icon" aria-hidden="true">
      <svg width="64" height="64" viewBox="0 0 24 24" fill="none">
        <path d="m12 3-1.912 5.813a2 2 0 0 1-1.275 1.275L3 12l5.813 1.912a2 2 0 0 1 1.275 1.275L12 21l1.912-5.813a2 2 0 0 1 1.275-1.275L21 12l-5.813-1.912a2 2 0 0 1-1.275-1.275Z" stroke="#fff" stroke-width="1.8" stroke-linejoin="round"/>
        <path d="m5 3 1 2.5L8.5 6 6 7 5 9.5 4 7 1.5 6 4 5.5Z" stroke="#fff" stroke-width="1.6" stroke-linejoin="round"/>
        <path d="m19 17 1 2.5 2.5.5-2.5 1-1 2.5-1-2.5-2.5-1 2.5-1Z" stroke="#fff" stroke-width="1.6" stroke-linejoin="round"/>
      </svg>
    </div>
    <div class="gl-step">
      <span id="gl-icon-slot"></span>
      <span id="gl-text">Uploading your photos...</span>
    </div>
    <div class="gl-progress">
      <div class="gl-track"><div class="gl-fill" id="gl-fill"></div></div>
      <div class="gl-pct" id="gl-pct">0%</div>
    </div>
    <div class="gl-dots" id="gl-dots"></div>
    <div class="gl-foot">Creating something amazing...</div>
  </div>
<script>
(function () {
  var steps = [
    { text: 'Uploading your photos...', duration: 2000 },
    { text: 'Preparing your generation...', duration: 2500 },
    { text: 'Queuing your image...', duration: 2000 },
    { text: 'Almost there...', duration: 1500 }
  ];
  var icons = [
    '<svg width="24" height="24" viewBox="0 0 24 24" fill="none"><rect width="18" height="18" x="3" y="3" rx="2" stroke="#fff" stroke-width="2"/><circle cx="9" cy="9" r="2" stroke="#fff" stroke-width="2"/><path d="m21 15-3.086-3.086a2 2 0 0 0-2.828 0L6 21" stroke="#fff" stroke-width="2" stroke-linecap="round"/></svg>',
    '<svg width="24" height="24" viewBox="0 0 24 24" fill="none"><path d="m21.64 3.64-1.28-1.28a1.21 1.21 0 0 0-1.72 0L2 18.56V22h3.44L21.64 5.36a1.21 1.21 0 0 0 0-1.72" stroke="#fff" stroke-width="2"/><path d="m14 7 3 3M5 6v4M19 14v4M10 2v2M7 8H3M21 16h-4M11 3H9" stroke="#fff" stroke-width="2" stroke-linecap="round"/></svg>',
    '<svg width="24" height="24" viewBox="0 0 24 24" fill="none"><path d="m12 3-1.912 5.813a2 2 0 0 1-1.275 1.275L3 12l5.813 1.912a2 2 0 0 1 1.275 1.275L12 21l1.912-5.813a2 2 0 0 1 1.275-1.275L21 12l-5.813-1.912a2 2 0 0 1-1.275-1.275Z" stroke="#fff" stroke-width="2"/></svg>',
    '<svg width="24" height="24" viewBox="0 0 24 24" fill="none"><path d="M21.801 10A10 10 0 1 1 17 3.335" stroke="#fff" stroke-width="2" stroke-linecap="round"/><path d="m9 11 2 2 4-4" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>'
  ];

  var textEl = document.getElementById('gl-text');
  var iconSlot = document.getElementById('gl-icon-slot');
  var fill = document.getElementById('gl-fill');
  var pct = document.getElementById('gl-pct');
  var dots = document.getElementById('gl-dots');
  var step = 0;
  var progress = 0;

  steps.forEach(function (_, i) {
    var d = document.createElement('span');
    d.className = 'gl-dot' + (i === 0 ? ' on' : '');
    dots.appendChild(d);
  });

  function setStep(i) {
    step = i;
    textEl.textContent = steps[i].text;
    iconSlot.innerHTML = icons[i];
    Array.prototype.forEach.call(dots.children, function (d, di) {
      d.classList.toggle('on', di <= i);
    });
  }

  setStep(0);

  var progTimer = setInterval(function () {
    if (progress >= 100) { clearInterval(progTimer); return; }
    progress += 1;
    fill.style.width = progress + '%';
    pct.textContent = progress + '%';
  }, 80);

  function next(i) {
    if (i >= steps.length) {
      setTimeout(function () {
        window.location.href = 'generated-result.html';
      }, 1000);
      return;
    }
    setStep(i);
    setTimeout(function () { next(i + 1); }, steps[i].duration);
  }
  setTimeout(function () { next(1); }, steps[0].duration);
})();
</script>
</body>
</html>
