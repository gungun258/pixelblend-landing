<style>
  :root {
    --ink: #1E1422; --muted: #5b5060; --soft: #8A7E92; --line: #F0E6F2;
    --bg: #FBFAFC; --accent: #C42E8B;
    --grad: linear-gradient(113.667deg, #A855F7, #EC4899, #F43F5E);
  }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: 'Hanken Grotesk', sans-serif; background: var(--bg); color: var(--ink); -webkit-font-smoothing: antialiased; }
  img { max-width: 100%; display: block; }
  a { color: inherit; text-decoration: none; }
  button { font-family: inherit; cursor: pointer; }
  [hidden] { display: none !important; }

  .pb-shell { display: flex; min-height: 100vh; background: var(--bg); }
  .pb-sidebar {
    width: 202px; flex: 0 0 202px; position: sticky; top: 0; height: 100vh;
    padding: 28px 14px 16px; display: flex; flex-direction: column;
    background: #fff; border-right: 1px solid var(--line);
  }
  .pb-brand { display: flex; align-items: center; gap: 10px; padding: 2px 4px; margin-bottom: 18px; }
  .pb-logo-mark {
    width: 32px; height: 32px; border-radius: 11px; background: var(--grad);
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 6px 16px rgba(196,46,139,.32); flex-shrink: 0;
  }
  .pb-logo-mark span { width: 12px; height: 12px; border: 2.5px solid #fff; border-radius: 50%; box-sizing: border-box; }
  .pb-brand-text {
    font-size: 17px; font-weight: 600; letter-spacing: -.02em;
    background: linear-gradient(90deg, #9333EA, #DB2777);
    -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent;
  }
  .pb-newblend {
    display: flex; align-items: center; justify-content: center; gap: 7px;
    padding: 11px 10px; border-radius: 12px; margin-bottom: 18px;
    background: var(--grad); color: #fff; font-size: 12px; font-weight: 700;
  }
  .pb-nav { display: flex; flex-direction: column; gap: 3.2px; }
  .pb-nav a {
    display: flex; align-items: center; gap: 10px; padding: 10px 11px; border-radius: 11px;
    font-size: 12px; font-weight: 600; color: var(--muted); min-height: 42px;
  }
  .pb-nav a:hover { background: transparent; color: var(--accent); }
  .pb-nav a.active { background: #FBEEF6 !important; color: var(--accent) !important; font-weight: 800 !important; }
  .pb-nav a .pb-ico { width: 22px; height: 22px; display: flex; align-items: center; justify-content: center; }
  .pb-navbadge {
    margin-left: auto; font-size: 9px; font-weight: 800; color: var(--accent);
    background: #FCE7F0; padding: 2px 6px; border-radius: 999px; min-width: 18px; text-align: center;
  }
  .pb-navbadge[hidden] { display: none !important; }
  .pb-credits {
    margin-top: auto; border: 1px solid var(--line); border-radius: 16px; padding: 14px;
    background: linear-gradient(165deg, #FBF1FB 0%, #fff 70%);
  }
  .pb-main { flex: 1 1 0; min-width: 0; display: flex; flex-direction: column; min-height: 100vh; }
  .pb-topbar {
    position: sticky; top: 0; z-index: 20; display: flex; align-items: center; gap: 16px;
    min-height: 64px; padding: 14px 32px;
    background: rgba(250,244,251,.88); backdrop-filter: blur(10px);
    border-bottom: 1px solid var(--line); flex-shrink: 0; box-sizing: border-box;
  }
  .pb-topbar-title { font-size: 15px; font-weight: 800; letter-spacing: -.02em; line-height: 1.2; }
  .pb-topbar-sub { font-size: 11px; color: #8A7E92; margin-top: 2px; line-height: 1.3; }
  .pb-top-actions { margin-left: auto; display: flex; align-items: center; gap: 12px; flex-shrink: 0; }
  .pb-content { flex: 1 1 auto; padding: 24px 32px 48px; width: 100%; }
  .pb-toggle { display: none; }
  .pb-back {
    display: inline-flex; align-items: center; justify-content: center;
    width: 36px; height: 36px; border-radius: 50%; border: 1px solid var(--line);
    background: #fff; color: var(--ink); margin-right: 4px; flex-shrink: 0;
  }
  .pb-back:hover { background: #FBF1FB; color: var(--accent); }

  .ts-flow { width: min(720px, 100%); margin: 0 auto; }
  .ts-search {
    display: flex; align-items: center; gap: 10px;
    background: #fff; border: 1px solid var(--line); border-radius: 14px;
    padding: 12px 14px; margin-bottom: 16px;
  }
  .ts-search svg { color: #94A3B8; flex-shrink: 0; }
  .ts-search input {
    flex: 1; border: none; outline: none; background: transparent;
    font-size: 14px; font-weight: 600; color: var(--ink);
  }
  .ts-search input::placeholder { color: #94A3B8; font-weight: 500; }
  .ts-filters {
    display: flex; align-items: center; gap: 8px;
    overflow-x: auto; -webkit-overflow-scrolling: touch;
    padding: 0 2px 4px; margin: 0 0 14px;
    scrollbar-width: none;
  }
  .ts-filters::-webkit-scrollbar { display: none; }
  .ts-chip {
    flex: 0 0 auto;
    display: inline-flex; align-items: center; gap: 7px;
    padding: 9px 14px; border-radius: 999px;
    border: 1.5px solid #E5E7EB; background: #fff;
    color: #1E1422; font-size: 13px; font-weight: 700;
    white-space: nowrap; cursor: pointer; font-family: inherit;
    transition: border-color .15s, background .15s, color .15s, box-shadow .15s;
  }
  .ts-chip:hover { border-color: #D8B4FE; }
  .ts-chip.on {
    border-color: #C084FC;
    background: #FAF5FF;
    color: #7C3AED;
    box-shadow: 0 0 0 1px rgba(168, 85, 247, .12);
  }
  .ts-chip .ts-chip-ico { display: inline-flex; flex-shrink: 0; }
  .ts-meta-line {
    margin: 0 0 14px; font-size: 13px; font-weight: 600; color: var(--soft);
  }

  .ts-list { display: flex; flex-direction: column; gap: 14px; }
  .ts-card {
    display: block; background: #fff; border: 1px solid var(--line);
    border-radius: 18px; padding: 14px 14px 12px;
    box-shadow: none;
    transition: border-color .15s ease, transform .15s ease;
  }
  .ts-card:hover {
    border-color: #E9D5FF;
    transform: translateY(-1px);
  }
  .ts-row {
    display: flex; align-items: center; gap: 12px; margin-bottom: 12px;
  }
  .ts-avatar-wrap {
    position: relative; flex-shrink: 0; width: 48px; height: 48px;
  }
  .ts-avatar {
    width: 48px; height: 48px; border-radius: 50%;
    overflow: hidden; background: linear-gradient(135deg, #A855F7, #EC4899);
    color: #fff; font-size: 18px; font-weight: 800;
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 0 0 2px #fff, 0 0 0 3.5px #E9D5FF;
  }
  .ts-avatar img { width: 100%; height: 100%; object-fit: cover; }
  .ts-verified {
    position: absolute; right: -2px; bottom: -2px;
    width: 18px; height: 18px; border-radius: 50%;
    background: #3B82F6; color: #fff;
    display: flex; align-items: center; justify-content: center;
    border: 2px solid #fff; box-shadow: 0 2px 6px rgba(59,130,246,.35);
  }
  .ts-meta { min-width: 0; flex: 1; }
  .ts-name {
    margin: 0 0 3px; font-size: 15px; font-weight: 800; letter-spacing: -.01em;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    display: flex; align-items: center; gap: 6px;
  }
  .ts-name-text {
    min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .ts-trend-badge {
    flex: 0 0 auto;
    display: inline-flex; align-items: center; justify-content: center;
    width: 22px; height: 22px; border-radius: 50%;
    background: linear-gradient(113deg, #A855F7, #EC4899, #F43F5E);
    box-shadow: 0 4px 10px rgba(168, 85, 247, .28);
  }
  .ts-stats {
    font-size: 12px; font-weight: 600; color: var(--soft);
  }
  .ts-follow {
    flex-shrink: 0; padding: 8px 14px; border-radius: 999px; border: none;
    background: var(--grad); color: #fff; font-size: 12px; font-weight: 800;
    display: inline-flex; align-items: center; gap: 5px;
  }
  .ts-follow.is-on { background: #F1F5F9; color: #64748B; }
  .ts-thumbs { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .ts-thumb {
    aspect-ratio: 1 / 1; border-radius: 12px; overflow: hidden;
    background: #F1F5F9; border: 1px solid var(--line);
  }
  .ts-thumb img { width: 100%; height: 100%; object-fit: cover; object-position: center; display: block; }
  .ts-thumb.empty { background: #F8FAFC; }
  .ts-empty { margin-top: 8px; }

  @media (max-width: 1079px) {
    .pb-sidebar { position: fixed; left: 0; top: 0; z-index: 50; width: 61px; flex-basis: 61px; padding: 22px 10px 14px; align-items: center; }
    .pb-sidebar.open { width: 202px; flex-basis: 202px; padding: 28px 14px 16px; align-items: stretch; box-shadow: 14px 0 38px -22px rgba(30,20,34,.4); }
    .pb-main { margin-left: 61px; }
    .pb-brand-text, .pb-label, .pb-navlabel, .pb-credits { display: none; }
    .pb-sidebar.open .pb-brand-text, .pb-sidebar.open .pb-label, .pb-sidebar.open .pb-navlabel, .pb-sidebar.open .pb-credits { display: block; }
    .pb-toggle { display: flex; width: 35px; height: 35px; border-radius: 10px; border: 1px solid var(--line); background: #fff; align-items: center; justify-content: center; margin-bottom: 14px; }
  }
  @media (max-width: 820px) {
    .pb-content { padding: 20px 16px 40px; }
    .pb-topbar { padding: 12px 16px; }
  }
</style>
</head>

        'https://images.unsplash.com/photo-1469334031218-e382a71b716b?w=400&q=80&auto=format&fit=crop'
      ]
    },
    {
      id: 'r-store',
      name: 'R store',
      listings: 6,
      trending: false, verified: true,
      avatar: '',
      thumbs: [
        'assets/dashboard/images/img25.jpg',
        'assets/dashboard/images/img20.jpg',
        'assets/dashboard/images/img21.jpg'
      ]
    },
    {
      id: 'digital-dreams',
      name: 'Digital Dreams',
      listings: 4,
      trending: false, verified: false,
      avatar: 'assets/dashboard/images/img32.jpg',
      thumbs: [
        'assets/dashboard/images/img16.jpg',
        'assets/dashboard/images/img23.jpg',
        'assets/dashboard/images/img24.jpg'
      ]
    },
    {
      id: 'emma-white',
      name: 'Emma White',
      listings: 4,
      trending: true, verified: true,
      avatar: 'assets/dashboard/images/img33.jpg',
      thumbs: [
        'assets/dashboard/images/img7.jpg',
        'assets/dashboard/images/img8.jpg',
        'assets/dashboard/images/img9.jpg'
      ]
    },
    {
      id: 'pixel-lab',
      name: 'Pixel Lab',
      listings: 3,
      trending: false, verified: false,
      avatar: 'assets/dashboard/images/img31.jpg',
      thumbs: [
        'assets/dashboard/images/img15.jpg',
        'assets/dashboard/images/img16.jpg',
        'assets/dashboard/images/img17.jpg'
      ]
    }
  ];

  var grid = document.getElementById('ts-grid');
  var countEl = document.getElementById('ts-count');
  var emptyEl = document.getElementById('ts-empty');
  var q = document.getElementById('ts-q');
  var filtersEl = document.getElementById('ts-filters');
  var activeFilter = 'all';
  if (window.pbSearchEmpty) {
    pbSearchEmpty.fill(emptyEl, 'No results found', 'Try another seller name — or clear search to explore everyone.');
  }

  function followLabel(on) {
    return on
      ? '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" aria-hidden="true"><circle cx="10" cy="8" r="3" stroke="currentColor" stroke-width="1.8"/><path d="M4.5 19c.9-3 3-4.6 5.5-4.6s4.6 1.6 5.5 4.6M17 8v6M14 11h6" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg> Following'
      : '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" aria-hidden="true"><circle cx="10" cy="8" r="3" stroke="currentColor" stroke-width="1.8"/><path d="M4.5 19c.9-3 3-4.6 5.5-4.6s4.6 1.6 5.5 4.6M17 8v6M14 11h6" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg> Follow';
  }

  function render(list) {
    grid.innerHTML = '';
    countEl.textContent = list.length + (list.length === 1 ? ' seller' : ' sellers');
    emptyEl.hidden = list.length > 0;
    list.forEach(function (s) {
      var on = window.pbFollows ? pbFollows.isFollowing(s.id) : false;
      var thumbs = '';
      for (var i = 0; i < 3; i++) {
        thumbs += s.thumbs[i]
          ? '<div class="ts-thumb"><img src="' + s.thumbs[i] + '" alt=""></div>'
          : '<div class="ts-thumb empty"></div>';
      }
      var initial = (s.name || '?').trim().charAt(0).toUpperCase();
      var avatarHtml = s.avatar
        ? '<img src="' + s.avatar + '" alt="">'
        : initial;
      var verified = s.verified
        ? '<span class="ts-verified" title="Verified"><svg width="9" height="9" viewBox="0 0 24 24" fill="none"><path d="M5 12.5l5 5L19 7.5" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg></span>'
        : '';
      var trendBadge = s.trending
        ? '<span class="ts-trend-badge" title="Trending" aria-label="Trending"><svg width="11" height="11" viewBox="0 0 24 24" fill="none"><path d="M3.5 16.5l5.2-5.2 3.3 3.3 6.5-7.1" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M14.2 7.5h4.3v4.3" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg></span>'
        : '';
      var a = document.createElement('a');
      a.className = 'ts-card';
      a.href = 'seller.html?id=' + encodeURIComponent(s.id);
      a.innerHTML =
        '<div class="ts-row">' +
          '<div class="ts-avatar-wrap"><div class="ts-avatar">' + avatarHtml + '</div>' + verified + '</div>' +
          '<div class="ts-meta">' +
            '<h2 class="ts-name"><span class="ts-name-text">' + s.name + '</span>' + trendBadge + '</h2>' +
            '<div class="ts-stats">' + s.listings + ' backgrounds</div>' +
          '</div>' +
          '<button type="button" class="ts-follow' + (on ? ' is-on' : '') + '" data-follow="' + s.id + '">' + followLabel(on) + '</button>' +
        '</div>' +
        '<div class="ts-thumbs">' + thumbs + '</div>';
      grid.appendChild(a);
    });
  }

  function filter() {
    var term = (q.value || '').trim().toLowerCase();
    var list = SELLERS.filter(function (s) {
      // Top Sellers = verified sellers (client rule)
      if (activeFilter === 'top' && !s.verified) return false;
      if (activeFilter === 'trending' && !s.trending) return false;
      if (activeFilter === 'verified' && !s.verified) return false;
      if (!term) return true;
      return s.name.toLowerCase().indexOf(term) !== -1 || String(s.id).toLowerCase().indexOf(term) !== -1;
    });
    render(list);
  }

  if (filtersEl) {
    filtersEl.addEventListener('click', function (e) {
      var chip = e.target.closest('[data-filter]');
      if (!chip) return;
      activeFilter = chip.getAttribute('data-filter') || 'all';
      Array.prototype.forEach.call(filtersEl.querySelectorAll('.ts-chip'), function (c) {
        var on = c === chip;
        c.classList.toggle('on', on);
        c.setAttribute('aria-selected', on ? 'true' : 'false');
      });
      filter();
    });
  }

  q.addEventListener('input', filter);
  filter();

  grid.addEventListener('click', function (e) {
    var btn = e.target.closest('[data-follow]');
    if (!btn) return;
    e.preventDefault();
    e.stopPropagation();
    var id = btn.getAttribute('data-follow');
    var on = window.pbFollows ? pbFollows.toggle(id) : btn.classList.toggle('is-on');
    btn.classList.toggle('is-on', on);
    btn.innerHTML = followLabel(on);
  });

  var toggle = document.getElementById('pb-toggle');
  var sidebar = document.getElementById('pb-sidebar');
  if (toggle && sidebar) {
    toggle.addEventListener('click', function () {
      sidebar.classList.toggle('open');
    });
  }
})();
</script>
<script src="js/pb-shell-nav.js?v=19"></script>
</body>
