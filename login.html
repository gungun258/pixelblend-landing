<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Sign In · PixelBlend Studio</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="js/pb-nav-boot.js?v=4"></script>
<link rel="stylesheet" href="css/pb-auth-screens.css?v=6">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body class="pb-auth-stage">
  <div class="pb-auth-stage-wrap">
    <header class="pb-auth-band">
      <div class="pb-auth-nav">
        <a class="pb-auth-back" id="auth-back" href="discover.html" aria-label="Back">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M15 18l-6-6 6-6" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </a>
        <div class="pb-auth-nav-switch">
          Don't have an account?
          <a id="signup-link" href="signup.html">Sign up</a>
        </div>
      </div>
      <div class="pb-auth-brand">PixelBlend</div>
    </header>

    <div class="pb-auth-sheet">
      <div class="pb-auth-sheet-head">
        <h1>Welcome back</h1>
        <p>Sign in to create, save and sell your PixelBlend designs.</p>
      </div>

      <form id="login-form" novalidate>
        <div class="pb-auth-field" id="f-phone">
          <label for="phone">Phone Number</label>
          <div class="pb-auth-input">
            <span class="pb-auth-ico" aria-hidden="true">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M7.5 3.5h3l1.2 4.2-1.8 1.1a13 13 0 005.3 5.3l1.1-1.8 4.2 1.2v3a2 2 0 01-2.2 2A15.5 15.5 0 015.5 5.7a2 2 0 012-2.2z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></svg>
            </span>
            <input id="phone" name="phone" type="tel" inputmode="numeric" autocomplete="tel" placeholder="10-digit mobile number">
          </div>
          <div class="pb-auth-err">Phone number is required</div>
        </div>

        <div class="pb-auth-field" id="f-pass">
          <label for="password">Password</label>
          <div class="pb-auth-input">
            <span class="pb-auth-ico" aria-hidden="true">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><rect x="5" y="11" width="14" height="10" rx="2" stroke="currentColor" stroke-width="1.8"/><path d="M8 11V8a4 4 0 018 0v3" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
            </span>
            <input id="password" name="password" type="password" autocomplete="current-password" placeholder="Enter your password">
            <button type="button" class="pb-auth-eye" data-eye="password" aria-label="Show password">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M2.5 12S6 6.5 12 6.5 21.5 12 21.5 12 18 17.5 12 17.5 2.5 12 2.5 12z" stroke="currentColor" stroke-width="1.8"/><circle cx="12" cy="12" r="2.8" stroke="currentColor" stroke-width="1.8"/></svg>
            </button>
          </div>
          <div class="pb-auth-err">Password is required</div>
        </div>

        <div class="pb-auth-row">
          <label class="pb-auth-check"><input type="checkbox" id="remember" checked> Remember me</label>
          <a class="pb-auth-link" id="forgot-link" href="forgot-password.html">Forgot password?</a>
        </div>

        <button class="pb-auth-submit" type="submit">Sign In</button>

        <div class="pb-auth-divider">Or continue with</div>
        <div class="pb-auth-social">
          <button type="button" class="pb-auth-social-btn" id="btn-google" aria-label="Continue with Google">
            <svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><path fill="#EA4335" d="M12 10.2v3.6h5.1c-.2 1.2-1.5 3.6-5.1 3.6-3.1 0-5.6-2.5-5.6-5.6S8.9 6.2 12 6.2c1.8 0 3 .7 3.7 1.4l2.5-2.4C16.7 3.7 14.6 2.8 12 2.8 6.9 2.8 2.8 6.9 2.8 12S6.9 21.2 12 21.2c5.5 0 9.1-3.9 9.1-9.3 0-.6-.1-1.1-.2-1.6H12z"/><path fill="#34A853" d="M3.9 7.4l3 2.2C7.8 7.5 9.7 6.2 12 6.2c1.8 0 3 .7 3.7 1.4l2.5-2.4C16.7 3.7 14.6 2.8 12 2.8 8.4 2.8 5.3 4.8 3.9 7.4z"/><path fill="#4A90E2" d="M12 21.2c2.5 0 4.6-.8 6.1-2.2l-2.9-2.2c-.8.5-1.8.9-3.2.9-3.5 0-6.5-2.4-7.5-5.6l-3 2.3c1.4 2.9 4.5 4.8 8.5 4.8z"/><path fill="#FBBC05" d="M4.5 14.7c-.2-.6-.3-1.2-.3-1.9s.1-1.3.3-1.9l-3-2.3C1.2 10 1 11 1 12.8s.2 2.8.5 4.1l3-2.2z"/></svg>
            Google
          </button>
          <button type="button" class="pb-auth-social-btn" id="btn-apple" aria-label="Continue with Apple">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M16.4 12.7c0-2.1 1.7-3.1 1.8-3.2-1-1.4-2.5-1.6-3-1.7-1.3-.1-2.5.8-3.1.8-.7 0-1.7-.7-2.8-.7-1.4 0-2.8.9-3.5 2.2-1.5 2.6-.4 6.4 1.1 8.5.7 1 1.6 2.2 2.7 2.1 1.1 0 1.5-.7 2.8-.7s1.6.7 2.8.7c1.2 0 1.9-1 2.6-2 .8-1.2 1.1-2.3 1.1-2.4-.1 0-2.1-.8-2.1-3.6zM14.7 6.5c.6-.7 1-1.7.9-2.7-0.9.1-1.9.6-2.5 1.3-.6.6-1.1 1.6-1 2.6 1 .1 1.9-.5 2.6-1.2z"/></svg>
            Apple
          </button>
        </div>

        <p class="pb-auth-legal">By continuing, you agree to our <a href="terms-of-service.html">Terms</a> and <a href="privacy-policy.html">Privacy Policy</a>.</p>
      </form>
    </div>
  </div>

<script src="js/pb-auth.js?v=1"></script>
<script src="js/pb-auth-screens.js?v=1"></script>
<script>
(function () {
  if (window.pbAuth && pbAuth.isLoggedIn()) {
    location.replace(pbAuthScreens.destination('dashboard.html'));
    return;
  }

  var back = document.getElementById('auth-back');
  var dest = pbAuthScreens.destination('discover.html');
  if (back) back.href = (dest.indexOf('login.html') >= 0 || dest.indexOf('signup.html') >= 0) ? 'discover.html' : dest;

  document.getElementById('forgot-link').href = pbAuthScreens.withNext('forgot-password.html');
  document.getElementById('signup-link').href = pbAuthScreens.withNext('signup.html');

  Array.prototype.forEach.call(document.querySelectorAll('.pb-auth-eye'), pbAuthScreens.bindEye);

  function clearField(id) {
    pbAuthScreens.setError(document.getElementById(id), false);
  }
  document.getElementById('phone').addEventListener('input', function () { clearField('f-phone'); });
  document.getElementById('password').addEventListener('input', function () { clearField('f-pass'); });

  function finish(extra) {
    pbAuthScreens.loginDemo(Object.assign({ at: Date.now(), via: 'password' }, extra || {}));
  }

  document.getElementById('login-form').addEventListener('submit', function (e) {
    e.preventDefault();
    var phone = document.getElementById('phone').value.trim();
    var pass = document.getElementById('password').value;
    var okPhone = pbAuthScreens.validPhone(phone);
    var okPass = !!pass;
    pbAuthScreens.setError(document.getElementById('f-phone'), !okPhone);
    pbAuthScreens.setError(document.getElementById('f-pass'), !okPass);
    if (!okPhone || !okPass) return;
    finish({
      phone: pbAuthScreens.digitsOnly(phone),
      remember: document.getElementById('remember').checked
    });
  });

  document.getElementById('btn-google').addEventListener('click', function () { finish({ via: 'google' }); });
  document.getElementById('btn-apple').addEventListener('click', function () { finish({ via: 'apple' }); });
})();
</script>
</body>
</html>
