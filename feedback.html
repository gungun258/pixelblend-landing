<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Feedback — PixelBlend</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="legal.css?v=17">
</head>
<body>
  <div id="pb-chrome-header"></div>
  <main class="lp-policy">
    <header class="lp-banner">
      <div class="lp-banner-glow" aria-hidden="true"></div>
      <div class="lp-banner-art" aria-hidden="true">
        <span class="lp-shard-1"></span>
        <span class="lp-shard-2"></span>
        <span class="lp-shard-3"></span>
      </div>
      <div class="lp-banner-inner">
        <h1>Feedback</h1>
      </div>
    </header>
    <div class="lp-sheet">
      <div class="lp-sheet-inner">
        <div class="lp-sheet-rule" aria-hidden="true"></div>
        <article class="lp-wrap lp-about">
          <p class="lp-meta">Tell us what worked, what didn’t, and what you want next — we read every note.</p>

          <div class="lp-tally-embed">
            <iframe
              data-tally-src="https://tally.so/embed/BzvVGY?alignLeft=1&hideTitle=1&transparentBackground=1&dynamicHeight=1"
              loading="lazy"
              width="100%"
              height="1299"
              frameborder="0"
              marginheight="0"
              marginwidth="0"
              title="Feedback form (No Email required)"></iframe>
          </div>
        </article>
      </div>
    </div>
  </main>
  <div id="pb-chrome-footer"></div>
  <script src="legal-chrome.js?v=26"></script>
  <script>
    var d = document, w = 'https://tally.so/widgets/embed.js',
      v = function () {
        if (typeof Tally !== 'undefined') Tally.loadEmbeds();
        else d.querySelectorAll('iframe[data-tally-src]:not([src])').forEach(function (e) {
          e.src = e.dataset.tallySrc;
        });
      };
    if (typeof Tally !== 'undefined') v();
    else if (d.querySelector('script[src="' + w + '"]') == null) {
      var s = d.createElement('script');
      s.src = w;
      s.onload = v;
      s.onerror = v;
      d.body.appendChild(s);
    }
  </script>
</body>
</html>
