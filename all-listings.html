<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>All Listings · PixelBlend Studio</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="js/pb-nav-boot.js?v=3"></script>
<link rel="stylesheet" href="css/pb-shell-nav.css?v=19">
<link rel="stylesheet" href="css/pb-search-empty.css?v=1">
<script src="js/pb-gallery.js?v=3"></script>
<script src="js/pb-wishlist.js?v=1"></script>
<script src="js/pb-search-empty.js?v=1"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #1E1422; --muted: #5b5060; --soft: #8A7E92; --line: #F0E6F2;
    --bg: #FBFAFC; --accent: #C42E8B;
    --grad: linear-gradient(113.667deg, #A855F7, #EC4899, #F43F5E);
    --pb-rail: 202px;
  }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: 'Hanken Grotesk', sans-serif; background: var(--bg); color: var(--ink); -webkit-font-smoothing: antialiased; }
  img { max-width: 100%; display: block; }
  a { color: inherit; text-decoration: none; }
  button, input { font-family: inherit; }
  button { cursor: pointer; }
  [hidden] { display: none !important; }

  .pb-shell { display: flex; min-height: 100vh; background: var(--bg); }
  .pb-sidebar {
    width: 202px; flex: 0 0 202px; position: sticky; top: 0; height: 100vh;
    padding: 28px 14px 16px; display: flex; flex-direction: column;
    background: #fff; border-right: 1px solid var(--line);
  }
  .pb-brand { display: flex; align-items: center; gap: 10px; padding: 2px 4px; margin-bottom: 18px; }
  .pb-logo-mark {
    width: 32px; height: 32px; border-radius: 11px; background: var(--grad);
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 6px 16px rgba(196,46,139,.32); flex-shrink: 0;
  }
  .pb-logo-mark span { width: 12px; height: 12px; border: 2.5px solid #fff; border-radius: 50%; }
  .pb-brand-text {
    font-size: 17px; font-weight: 600; letter-spacing: -.02em;
    background: linear-gradient(90deg, #9333EA, #DB2777);
    -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent;
  }
  .pb-newblend {
    display: flex; align-items: center; justify-content: center; gap: 7px;
    padding: 11px 10px; border-radius: 12px; margin-bottom: 18px;
    background: var(--grad); color: #fff; font-size: 12px; font-weight: 700;
  }
  .pb-nav { display: flex; flex-direction: column; gap: 3.2px; }
  .pb-nav a {
    display: flex; align-items: center; gap: 10px; padding: 10px 11px; border-radius: 11px;
    font-size: 12px; font-weight: 600; color: var(--muted); min-height: 42px;
  }
  .pb-nav a:hover { background: transparent; color: var(--accent); }
  .pb-nav a.active { background: #FBEEF6 !important; color: var(--accent) !important; font-weight: 800 !important; }
  .pb-nav a .pb-ico { width: 22px; height: 22px; display: flex; align-items: center; justify-content: center; }
  .pb-navbadge {
    margin-left: auto; font-size: 9px; font-weight: 800; color: var(--accent);
    background: #FCE7F0; padding: 2px 6px; border-radius: 999px;
  }
  .pb-navbadge[hidden] { display: none !important; }
  .pb-credits {
    margin-top: auto; border: 1px solid var(--line); border-radius: 16px; padding: 14px;
    background: linear-gradient(165deg, #FBF1FB 0%, #fff 70%);
  }
  .pb-main { flex: 1 1 0; min-width: 0; display: flex; flex-direction: column; min-height: 100vh; }
  .pb-topbar {
    position: sticky; top: 0; z-index: 20; display: flex; align-items: center; gap: 14px;
    min-height: 64px; padding: 14px 32px;
    background: rgba(250,244,251,.88); backdrop-filter: blur(10px);
    border-bottom: 1px solid var(--line); flex-shrink: 0;
  }
  .pb-topbar-title { font-size: 15px; font-weight: 800; }
  .pb-topbar-sub { font-size: 11px; color: #8A7E92; margin-top: 2px; }
  .pb-top-actions { margin-left: auto; display: flex; align-items: center; gap: 10px; }
  .pb-back {
    width: 36px; height: 36px; border-radius: 50%; border: 1px solid var(--line);
    background: #fff; display: inline-flex; align-items: center; justify-content: center;
  }
  .pb-back:hover { background: #FBF1FB; }
  .pb-content { flex: 1 1 auto; padding: 24px 32px 48px; }
  .pb-toggle { display: none; }

  .al-flow { width: min(980px, 100%); margin: 0 auto; }
  .al-search {
    display: flex; align-items: center; gap: 10px;
    background: #fff; border: 1px solid var(--line); border-radius: 14px;
    padding: 12px 14px; margin-bottom: 20px;
  }
  .al-search svg { color: #94A3B8; flex-shrink: 0; }
  .al-search input {
    flex: 1; border: none; outline: none; background: transparent;
    font-size: 14px; font-weight: 600; color: var(--ink);
  }
  .al-search input::placeholder { color: #94A3B8; font-weight: 500; }
  .al-meta {
    margin: 0 0 14px; font-size: 13px; font-weight: 600; color: var(--soft);
  }
  .al-grid {
    display: grid;
    grid-template-columns: repeat(3, minmax(0, 1fr));
    gap: 18px;
  }
  .al-card {
    display: block;
    background: #fff;
    border: 1px solid var(--line);
    border-radius: 16px;
    overflow: hidden;
    box-shadow: none;
    transition: border-color .15s ease, transform .15s ease;
  }
  .al-card:hover {
    border-color: #E9D5FF;
    transform: translateY(-2px);
  }
  .al-media {
    position: relative;
    aspect-ratio: 4 / 5;
    background: #F1F5F9;
    overflow: hidden;
  }
  .al-media img {
    width: 100%; height: 100%;
    object-fit: cover; object-position: center;
  }
  .al-badge {
    position: absolute; top: 10px; right: 10px;
    width: 28px; height: 28px; border-radius: 50%;
    background: linear-gradient(113deg, #A855F7, #EC4899);
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 6px 14px rgba(168,85,247,.35);
  }
  .al-body { padding: 12px 12px 14px; }
  .al-body strong {
    display: block; font-size: 13px; font-weight: 700;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .al-empty { margin-top: 8px; }

  @media (max-width: 1079px) {
    :root { --pb-rail: 61px; }
    .pb-sidebar { position: fixed; left: 0; top: 0; z-index: 50; width: 61px; flex-basis: 61px; padding: 22px 10px 14px; align-items: center; }
    .pb-sidebar.open { width: 202px; flex-basis: 202px; padding: 28px 14px 16px; align-items: stretch; box-shadow: 14px 0 38px -22px rgba(30,20,34,.4); }
    .pb-main { margin-left: 61px; }
    .pb-brand-text, .pb-label, .pb-navlabel, .pb-credits { display: none; }
    .pb-sidebar.open .pb-brand-text, .pb-sidebar.open .pb-label, .pb-sidebar.open .pb-navlabel, .pb-sidebar.open .pb-credits { display: block; }
    .pb-toggle { display: flex; width: 35px; height: 35px; border-radius: 10px; border: 1px solid var(--line); background: #fff; align-items: center; justify-content: center; margin-bottom: 14px; }
    .pb-content { padding: 20px; }
    .al-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; }
  }
  @media (max-width: 640px) {
    .pb-content { padding: 16px; }
    .al-grid { gap: 12px; }
  }
</style>
</head>
<body>
<div class="pb-shell">
  <aside class="pb-sidebar" id="pb-sidebar">
    <button class="pb-toggle" id="pb-toggle" aria-label="Toggle menu">☰</button>
    <a href="index.html" class="pb-brand">
      <span class="pb-logo-mark"><span></span></span>
      <span class="pb-brand-text">PixelBlend</span>
    </a>
    <a href="generate.html" class="pb-newblend">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none"><path d="M12 5v14M5 12h14" stroke="#fff" stroke-width="2.4" stroke-linecap="round"></path></svg>
      <span class="pb-label">New blend</span>
    </a>
    <nav class="pb-nav">
      <a href="dashboard.html" class="active">
        <span class="pb-ico"><svg width="16" height="16" viewBox="0 0 24 24" fill="none"><path d="M3 11l9-8 9 8M5 9.5V20h5v-5h4v5h5V9.5" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
        <span class="pb-navlabel">Home</span>
      </a>
      <a href="discover.html">
        <span class="pb-ico"><svg width="16" height="16" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="9" stroke="currentColor" stroke-width="1.9"/><path d="M15.5 8.5l-2 5-5 2 2-5z" stroke="currentColor" stroke-width="1.9" stroke-linejoin="round"/></svg></span>
        <span class="pb-navlabel">Discover</span>
      </a>
      <a href="generate.html">
        <span class="pb-ico"><svg width="16" height="16" viewBox="0 0 24 24" fill="none"><path d="M12 3l1.8 5.2L19 10l-5.2 1.8L12 17l-1.8-5.2L5 10l5.2-1.8z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></svg></span>
        <span class="pb-navlabel">Generate</span>
      </a>
      <a href="gallery.html">
        <span class="pb-ico"><svg width="16" height="16" viewBox="0 0 24 24" fill="none"><rect x="3" y="4" width="18" height="16" rx="2.5" stroke="currentColor" stroke-width="1.9"/><circle cx="8.5" cy="9.5" r="1.6" stroke="currentColor" stroke-width="1.6"/><path d="M5 17l4.5-4 3 2.5L16 11l3 3.5" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
        <span class="pb-navlabel">Gallery</span>
        <span class="pb-navbadge" data-pb-gallery-count hidden>0</span>
      </a>
      <a href="account.html">
        <span class="pb-ico"><svg width="16" height="16" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="8" r="3.5" stroke="currentColor" stroke-width="1.9"/><path d="M4.8 20c1-3.5 3.7-5.4 7.2-5.4s6.2 1.9 7.2 5.4" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"/></svg></span>
        <span class="pb-navlabel">Account</span>
      </a>
    </nav>
    <div class="pb-credits">
      <div style="display:flex;justify-content:space-between;margin-bottom:8px;">
        <span style="font-size:10px;font-weight:700;color:#8A7E92;">Credits left</span>
        <span style="font-size:13px;font-weight:800;">140</span>
      </div>
    </div>
  </aside>

  <main class="pb-main">
    <header class="pb-topbar">
      <a class="pb-back" href="dashboard.html" id="al-back" aria-label="Back">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none"><path d="M15 6l-6 6 6 6" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </a>
      <div>
        <div class="pb-topbar-title">All Listings</div>
        <div class="pb-topbar-sub">Trending backgrounds from the marketplace</div>
      </div>
      <div class="pb-top-actions">
        <a href="buy-credits.html" aria-label="Buy credits" style="display:inline-flex;align-items:center;gap:6px;text-decoration:none;padding:7px 12px;border-radius:999px;background:#fff;border:1px solid #F4E2B8;box-shadow:0 2px 8px rgba(224,168,40,.12);">
          <span style="display:inline-flex;width:18px;height:18px;border-radius:50%;background:linear-gradient(135deg,#F7C948,#EFA12B);align-items:center;justify-content:center;color:#fff;font-size:10px;">◆</span>
          <span style="font-size:12px;font-weight:800;color:#B7791F;">150</span>
        </a>
        <a href="notifications.html" aria-label="Notifications" style="text-decoration:none;position:relative;width:36px;height:36px;border-radius:50%;border:1px solid #F0E6F2;background:#fff;cursor:pointer;display:flex;align-items:center;justify-content:center;">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none"><path d="M18 8a6 6 0 1 0-12 0c0 7-3 9-3 9h18s-3-2-3-9" stroke="#1E1422" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><path d="M13.7 21a2 2 0 0 1-3.4 0" stroke="#1E1422" stroke-width="1.8" stroke-linecap="round"/></svg>
          <span style="position:absolute;top:8px;right:9px;width:7px;height:7px;border-radius:50%;background:#F43F5E;border:1.5px solid #fff;"></span>
        </a>
        <a href="account.html" aria-label="Account" style="text-decoration:none;display:flex;align-items:center;gap:7px;padding:4px;border-radius:999px;border:1px solid #F0E6F2;background:#fff;cursor:pointer;">
          <img src="assets/dashboard/images/img1.jpg" alt="" style="width:28px;height:28px;border-radius:50%;object-fit:cover;">
          <svg width="10" height="10" viewBox="0 0 24 24" fill="none" style="margin-right:6px;"><path d="M6 9l6 6 6-6" stroke="#8A7E92" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </a>
      </div>
    </header>

    <div class="pb-content">
      <div class="al-flow">
        <div class="al-search">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" aria-hidden="true"><circle cx="11" cy="11" r="6.5" stroke="currentColor" stroke-width="1.8"/><path d="M16.2 16.2L21 21" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
          <input type="search" id="al-q" placeholder="Search listings..." autocomplete="off">
        </div>
        <p class="al-meta" id="al-meta">0 listings</p>
        <div class="al-grid" id="al-grid"></div>
        <div class="al-empty pb-search-empty" id="al-empty" hidden></div>
      </div>
    </div>
  </main>
</div>

<script>
(function () {
  if (typeof window.__pbNavReady === 'function') window.__pbNavReady();
  if (window.pbGallery) pbGallery.refreshBadges();

  var toggle = document.getElementById('pb-toggle');
  var sidebar = document.getElementById('pb-sidebar');
  if (toggle && sidebar) {
    toggle.addEventListener('click', function () { sidebar.classList.toggle('open'); });
  }

  var backBtn = document.getElementById('al-back');
  if (backBtn) {
    backBtn.addEventListener('click', function (e) {
      if (window.history.length > 1) {
        e.preventDefault();
        window.history.back();
      }
    });
  }

  var LISTINGS = [
    { id: 'mountain-sunset', title: 'Mountain Sunset', img: 'assets/dashboard/images/img23.jpg', trending: true },
    { id: 'night-sky', title: 'Night Sky', img: 'assets/dashboard/images/img24.jpg', trending: true },
    { id: 'beach-waves', title: 'Beach Waves', img: 'assets/dashboard/images/img25.jpg', trending: false },
    { id: 'forest-mist', title: 'Forest Mist', img: 'assets/dashboard/images/img26.jpg', trending: true },
    { id: 'meadow-light', title: 'Meadow Light', img: 'https://images.unsplash.com/photo-1506905925346-21bda4d32df4?w=800&q=80&auto=format&fit=crop', trending: false },
    { id: 'cosmic-drift', title: 'Cosmic Drift', img: 'https://images.unsplash.com/photo-1419242902214-272b3f66ee7a?w=800&q=80&auto=format&fit=crop', trending: false },
    { id: 'rustic-charm', title: 'Rustic Charm', img: 'assets/dashboard/images/img2.jpg', trending: true },
    { id: 'ocean-breeze', title: 'Ocean Breeze', img: 'https://images.unsplash.com/photo-1433086966358-54859d0ed716?w=800&q=80&auto=format&fit=crop', trending: false },
    { id: 'cherry-blossom', title: 'Cherry Blossom', img: 'https://images.unsplash.com/photo-1522383225653-ed111181a951?w=800&q=80&auto=format&fit=crop', trending: false },
    { id: 'studio-softbox', title: 'Studio Softbox', img: 'assets/dashboard/images/img5.jpg', trending: false },
    { id: 'marble-luxe', title: 'Marble Luxe', img: 'assets/dashboard/images/img8.jpg', trending: false },
    { id: 'golden-hour', title: 'Golden Hour', img: 'assets/dashboard/images/img12.jpg', trending: true }
  ];

  var grid = document.getElementById('al-grid');
  var meta = document.getElementById('al-meta');
  var empty = document.getElementById('al-empty');
  var q = document.getElementById('al-q');
  if (window.pbSearchEmpty) {
    pbSearchEmpty.fill(empty, 'No results found', 'Try another keyword — or clear search to browse all listings.');
  }

  function badgeSvg() {
    return '<svg width="12" height="12" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M3.5 16.5l5.2-5.2 3.3 3.3 6.5-7.1" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M14.2 7.5h4.3v4.3" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>';
  }

  function render(list) {
    grid.innerHTML = '';
    meta.textContent = list.length + (list.length === 1 ? ' listing' : ' listings');
    empty.hidden = list.length > 0;
    list.forEach(function (item) {
      var a = document.createElement('a');
      a.className = 'al-card';
      a.href = 'listing.html?id=' + encodeURIComponent(item.id);
      a.innerHTML =
        '<div class="al-media">' +
          '<img src="' + item.img + '" alt="' + item.title.replace(/"/g, '&quot;') + '">' +
          (item.trending ? '<span class="al-badge" title="Trending">' + badgeSvg() + '</span>' : '') +
        '</div>' +
        '<div class="al-body"><strong>' + item.title + '</strong></div>';
      try {
        sessionStorage.setItem('pb-listing-fallback', JSON.stringify({
          id: item.id, title: item.title, img: item.img, seller: 'Marketplace'
        }));
      } catch (e) {}
      a.addEventListener('click', function () {
        try {
          sessionStorage.setItem('pb-listing-fallback', JSON.stringify({
            id: item.id, title: item.title, img: item.img, seller: 'Marketplace'
          }));
        } catch (err) {}
      });
      grid.appendChild(a);
    });
  }

  function filter() {
    var term = (q.value || '').trim().toLowerCase();
    if (!term) {
      render(LISTINGS.slice());
      return;
    }
    render(LISTINGS.filter(function (x) {
      return x.title.toLowerCase().indexOf(term) !== -1 || x.id.indexOf(term) !== -1;
    }));
  }

  q.addEventListener('input', filter);
  render(LISTINGS.slice());
})();
</script>
<script src="js/pb-shell-nav.js?v=19"></script>
</body>
</html>
